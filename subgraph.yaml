# features:
#   - grafting
# graft:
#   base: QmeWcqPd2QvWiLsNWRZsiYxwqqBRszTHfsSTXusWf2Z8bA # Subgraph ID of base subgraph
#   block: 64874170 # Block number
specVersion: 0.0.4
schema:
    file: ./schema.graphql
dataSources:
    - kind: ethereum/contract
      name: Contract
      network: "base-sepolia"
      source:
          address: "0x5D2364F343f928159492E79067F1883f1f9DE394"
          abi: Contract
          startBlock: 26415768
      mapping:
          kind: ethereum/events
          apiVersion: 0.0.6
          language: wasm/assemblyscript
          entities:
              - ClaimAavegotchi
              - EquipWearables
          abis:
              - name: Contract
                file: ./abis/Contract.json
          eventHandlers:
              - event: EquipWearables(indexed uint256,uint16[16],uint16[16])
                handler: handleEquipWearables
              - event: ClaimAavegotchi(indexed uint256)
                handler: handleClaimAavegotchi
              - event: Transfer(indexed address,indexed address,indexed uint256)
                handler: handleTransfer
              - event: AavegotchiHistory((uint256,string,uint256,uint256[],uint256,uint256))
                handler: handleAavegotchiHistory
                
          blockHandlers:
              - handler: handleBlock
          file: ./src/mapping.ts
